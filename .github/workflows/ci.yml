name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gameserver, scoreserver, webserver]
    steps:
      - uses: actions/checkout@v7
      - name: Build image (runs uv sync with UV_FROZEN=1 on the deployed python:3.8, fails if uv.lock is out of date)
        run: docker build -t waboorrt/${{ matrix.service }}-test ${{ matrix.service }}
      - name: Compile
        run: docker run --rm waboorrt/${{ matrix.service }}-test python -m compileall -q app.py
